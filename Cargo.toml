[workspace]
resolver = "3"

members = [
  "kernel/core",
  "kernel/builtin",
  "kernel/arch",
  "kernel/exceptions",
  "kernel/cpu",
  "kernel/mm",
#"rivers",
#"toolchain",
]

[workspace.package]
version = "0.1.0"
edition = "2024" 
authors = ["Leonid Levchishin <you@example.com>"]

[workspace.dependencies]
kernel_arch = { path = "kernel/arch" }
kernel_builtin = { path = "kernel/builtin" }
kernel_core = { path = "kernel/core" }
kernel_exceptions = { path = "kernel/exceptions" }
kernel_cpu = { path = "kernel/cpu" }
kernel_mm = { path = "kernel/mm" }

driver_uart = { path = "drivers/uart" }

fdt = "0.1.5"

# Dev image: release codegen with run-time checks turned on. Keeps the
# optimized layout (avoids opt-level-0 surprises in a no_std kernel) while
# enabling debug_assert! and arithmetic overflow checks for bring-up.
[profile.release-dev]
inherits = "release"
debug-assertions = true
overflow-checks = true

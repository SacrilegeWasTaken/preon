[package]
name = "kernel_mm"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "kernel_mm"
path = "lib.rs"
test = false
bench = false

[dependencies]
kernel_builtin.workspace = true
kernel_arch.workspace = true
fdt.workspace = true

# `cfg(kani)` is set only by the Kani verifier; declare it so a normal
# `cargo build` doesn't warn about the `#[cfg(kani)]` harness modules.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
